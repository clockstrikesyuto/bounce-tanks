name: Apply BOUNCE TANKS v4.2 patch

on:
  push:
    branches: [main]
    paths:
      - 'v4_2_apply.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v4.2 local-first controls
        run: |
          python v4_2_apply.py
          rm v4_2_apply.py
          rm -f v4_2.patch
          rm .github/workflows/apply-v4-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply v4.2 local-first controls"
          git push
