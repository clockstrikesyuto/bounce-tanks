<style>
:root{--bg:#090b10;--card:#121722;--card2:#1a2130;--line:#2b3445;--txt:#f7fbff;--muted:#9aa7b9;--accent:#64e5ff;--danger:#ff6d8d;--ok:#8cff8a;--warn:#ffd15c;--r:22px}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 15% 0,#14263a 0,transparent 34%),radial-gradient(circle at 100% 35%,#2a1727 0,transparent 26%),var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}body{min-height:100svh;overscroll-behavior:none}.app{max-width:900px;margin:auto;padding:16px 14px 42px}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brandMain{display:flex;align-items:center;gap:10px}.logo{width:48px;height:48px;border:1px solid #476078;border-radius:14px;background:linear-gradient(145deg,#1a2838,#0c1119);display:grid;place-items:center;font-size:25px;box-shadow:inset 0 0 20px #15283a}.brand h1{font-size:18px;letter-spacing:.13em;margin:0}.brand small{color:var(--muted)}.pill{border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900;color:#dce8f5;background:#111722}.screen{display:none}.screen.on{display:block}.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.018));border-radius:var(--r);padding:17px;margin-bottom:12px;box-shadow:0 18px 55px rgba(0,0,0,.27)}.hero{padding:25px 20px}.eyebrow,.smallcaps{font-size:11px;letter-spacing:.14em;font-weight:1000;color:var(--muted)}.hero h2{font-size:clamp(30px,7vw,50px);line-height:1.05;letter-spacing:-.045em;margin:9px 0 12px}.hero p,.hint{color:#ced7e2;line-height:1.7}.hint{font-size:13px}.btn{width:100%;border:0;border-radius:15px;padding:14px 16px;background:#f5fbff;color:#0a1018;font-weight:1000;margin-top:9px;font-size:15px}.btn.secondary{background:var(--card2);color:#fff;border:1px solid var(--line)}.btn.ghost{background:transparent;color:#d7e1 play:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;touch-action:none}.dpad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,64px);gap:7px}.rightControls{display:grid;grid-template-rows:1fr 54px;gap:7px}.ctrl,.shoot,.itemBtn,.react{border:1px solid #33445a;color:#fff;font-weight:1000;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none}.ctrl,.shoot,.itemBtn{background:#111a27;border-radius:18px}.ctrl{font-size:25px}.ctrl.on,.shoot.on,.itemBtn.on{transform:scale(.97);background:#24334a}.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}.shoot{font-size:18px;background:linear-gradient(145deg,#3d1720,#241017);border-color:#683141;min-height:74px}.shoot span{display:block;font-size:30px}.itemBtn{font-size:14px;background:linear-gradient(145deg,#1d2940,#111925);border-color:#40577b}.itemBtn.ready{box-shadow:0 0 20px rgba(100,229,255,.24);border-color:#64e5ff}.itemBtn:disabled{opacity:.35}.spectator{display:none;align-items:center;justify-content:center;gap:10px;margin-top:12px;padding:18px;border:1px dashed #516075;border-radius:18px;background:#0d121a;color:#dce7f4;font-weight:900}.spectator.on{display:flex}.reactions{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}.react{background:#171f2c;border-radius:999px;padding:8px 12px;font-size:18px}.reactionToast{position:absolute;right:12px;top:12px;z-index:7;display:grid;gap:6px;pointer-events:none}.reactionItem,.killItem{background:rgba(7,10,15,.82);border:1px solid #334055;border-radius:999px;padding:7px 10px;font-size:12px;backdrop-filter:blur(7px)}.reactionItem b{font-size:18px;margin-right:5px}.killfeed{position:absolute;left:12px;top:12px;z-index:7;display:grid;gap:6px;pointer-events:none}.killItem{border-radius:10px;color:#fff}.itemLegend{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:10px 0 0;color:#91a0b4;font-size:11px}.itemLegend span{border:1px solid var(--line);border-radius:999px;padding:5px 8px;background:#0c1119}.landscapeHint{display:none;color:var(--warn);font-size:12px;text-align:center;margin:8px 0}.footer{text-align:center;color:#687488;font-size:11px;line-height:1.6;margin-top:18px}.status{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#fff;color:#111;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:900;opacity:0;pointer-events:none;transition:.2s;z-index:99}.status.show{opacity:1}.gameNoSelect,.gameNoSelect *{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important;-webkit-user-drag:none!important}@media(max-width:620px){.grid{grid-template-columns:1fr}.app{padding:12px 10px 32px}.card{padding:15px}.gameCard{padding:10px}.controls{gap:8px}.dpad{grid-template-rows:repeat(2,58px);gap:6px}.rightControls{grid-template-rows:1fr 48px}.landscapeHint{display:block}}@media(orientation:landscape) and (max-height:540px){.brand{display:none}.app{max-width:100%;padding:6px}.gameCard{border:0;padding:0;background:transparent;box-shadow:none}.hudTop{position:absolute;left:8px;right:8px;top:8px;z-index:8;pointer-events:none}.scoreboard{justify-content:center}.controls{position:fixed;inset:auto 8px 8px 8px;z-index:9;grid-template-columns:220px 170px;justify-content:space-between;pointer-events:none}.controls>*{pointer-events:auto;opacity:.85}.dpad{grid-template-rows:repeat(2,52px)}.rightControls{grid-template-rows:72px 38px}.shoot{min-height:72px}.itemBtn{border-radius:13px}.spectator{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9;margin:0;background:rgba(13,18,26,.88);padding:11px 18px}.landscapeHint,.itemLegend{display:none}.reactions{position:fixed;right:12px;top:10px;z-index:10;flex-direction:column}.react{padding:5px 8px}.canvasWrap{border-radius:12px;height:calc(100svh - 12px)}.canvasWrap canvas{width:100%;height:100%;object-fit:contain}.footer{display:none}}
</style>

<body>
<div class="app">
<div class="brand"><div class="brandMain"><div class="logo">💥</div><div><h1>BOUNCE TANKS</h1><small>跳ね返して、生き残れ。</small></div></div><div class="pill" id="conn">OFFLINE</div></div>
<section id="home" class="screen on"><div class="card hero"><div class="eyebrow">REAL-TIME BATTLE</div><h2>撃て。拾え。<br>最後まで残れ。</h2><p>迷路の中で戦車バトル。弾は壁で反射。v2ではレーザー・ショットガン・シールド・地雷のアイテムが出現します。</p></div><div class="card"><div class="grid"><div><label>あなたの名前</label><input id="hostName" maxlength="18" placeholder="ゆうと"></div><div><label>勝利条件</label><select id="targetScore"><option value="3">3点先取</option><option value="5" selected>5点先取</option><option value="7">7点先取</option></select></div></div><button class="btn" id="create">部屋をつくる</button></div><div class="card"><label>4桁の部屋コードで参加</label><div class="copyline"><input id="joinCode" inputmode="numeric" maxlength="4" placeholder="1234"><button class="btn secondary" style="margin:0" id="goJoin">参加</button></div></div></section>
<section id="join" class="screen"><div class="card hero center"><div class="eyebrow">JOIN ROOM</div><div class="code" id="joinCodeBig"></div><p>名前を入力して戦場へ。</p></div><div class="card"><label>あなたの名前</label><input id="playerName" maxlength="18" placeholder="プレイヤー"><button class="btn" id="joinBtn">この部屋に参加</button><button class="btn ghost" onclick="location.href='/'">戻る</button></div></section>
<section id="room" class="screen"><div id="lobby"></div><div id="game" style="display:none"></div></section><div class="footer">BOUNCE TANKS v2 — リアルタイム迷路戦車バトル。</div></div><div class="status" id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],parts=location.pathname.split('/').filter(Boolean);let code=null,role=null,hostToken=null,playerId=null,playerToken=null,ws=null,state=null,retry=null,gameMounted=false,lobbySig='',input={up:false,down:false,left:false,right:false,shoot:false};const ITEM={laser:['⚡','LASER'],shotgun:['🔱','SHOTGUN'],shield:['🛡️','SHIELD'],mine:['💣','MINE']},sk=(k,c)=>`bt_${k}_${c}`;
function show(id){$$('.screen').forEach(x=>x.classList.remove('on'));$('#'+id).classList.add('on');scrollTo(0,0)}function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1600)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function api(url,opt={}){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});if(!r.ok){let j={};try{j=await r.json()}catch{}throw Error(j.detail||'通信に失敗しました')}return r.json()}
$('#create').onclick=async()=>{try{let d=await api('/api/rooms',{method:'POST',body:JSON.stringify({name:$('#hostName').value.trim()||'HOST',target_score:+$('#targetScore').value})});location.href=d.host_url}catch(e){toast(e.message)}};$('#goJoin').onclick=()=>{let c=$('#joinCode').value.replace(/\D/g,'');if(c.length!==4)return toast('4桁のコードを入力してね');location.href='/join/'+c};
function hostInit(){let m=location.hash.match(/token=([^&]+)/);hostToken=m?decodeURIComponent(m[1]):localStorage.getItem(sk('host',code));if(!hostToken){location.href='/';return}localStorage.setItem(sk('host',code),hostToken);history.replaceState(null,'',`/host/${code}`);connect('host')}async function joinInit(){show('join');$('#joinCodeBig').textContent=code;try{await api('/api/rooms/'+code)}catch(e){toast(e.message)}let saved=JSON.parse(localStorage.getItem(sk('player',code))||'null');if(saved?.player_id&&saved?.player_token){playerId=saved.player_id;playerToken=saved.player_token;connect('player');return}$('#joinBtn').onclick=async()=>{try{let d=await api(`/api/rooms/${code}/join`,{method:'POST',body:JSON.stringify({name:$('#playerName').value})});playerId=d.player_id;playerToken=d.player_token;localStorage.setItem(sk('player',code),JSON.stringify(d));connect('player')}catch(e){toast(e.message)}}}
function connect(r){role=r;show('room');if(ws)try{ws.close()}catch{}clearTimeout(retry);let proto=location.protocol==='https:'?'wss':'ws',url=`${proto}://${location.host}/ws/${code}?role=${r}&token=${encodeURIComponent(r==='host'?hostToken:playerToken)}`;if(r==='player')url+=`&player_id=${encodeURIComponent(playerId)}`;ws=new WebSocket(url);ws.onopen=()=>{$('#conn').textContent='LIVE';$('#conn').style.color='#8cff8a';sendInput()};ws.onclose=()=>{$('#conn').textContent='RECONNECT';$('#conn').style.color='';retry=setTimeout(()=>connect(r),1500)};ws.onmessage=e=>{let d=JSON.parse(e.data);if(d.type==='error')return toast(d.message);state=d;playerId=d.player_id||playerId;render(d)}}function send(action,extra={}){if(ws?.readyState===1)ws.send(JSON.stringify({action,...extra}))}function sendInput(){send('input',{keys:input})}function setInput(k,v){if(input[k]===v)return;input[k]=v;sendInput()}function resetInput(){let changed=false;for(let k in input){if(input[k])changed=true;input[k]=false}$$('[data-key]').forEach(b=>b.classList.remove('on'));if(changed)sendInput()}
function playersHtml(s){return s.players.map(p=>`<div class="player"><span class="dot" style="background:${p.color};color:${p.color}"></span><strong>${esc(p.name)}</strong>${p.id===s.host_player_id?'<span class="hostBadge">HOST</span>':''}</div>`).join('')}function scores(s){return s.players.map(p=>`<div class="scoreChip" style="border-color:${p.color}66"><span style="color:${p.color}">●</span> ${esc(p.name)} <strong>${p.score}</strong>/${s.target_score}</div>`).join('')}
function renderLobby(s){let sig=`${s.players.map(p=>p.id+':'+p.name).join('|')}|${s.is_host}|${s.target_score}`;if(sig===lobbySig)return;lobbySig=sig;let url=location.origin+`/join/${s.code}`;$('#lobby').innerHTML=`<div class="card center"><div class="smallcaps">ROOM CODE</div><div class="code">${s.code}</div>${s.is_host?`<img class="qr" src="/room/${s.code}/qr" alt="参加用QRコード"><div class="copyline"><input id="joinUrl" value="${esc(url)}" readonly><button class="btn secondary" id="copy" style="margin:0">コピー</button></div><p class="hint">QRコードかURLを友達に送って参加。</p>`:'<p class="hint">ホストがゲームを始めるまで待ってね。</p>'}</div><div class="card"><div class="smallcaps">PLAYERS ${s.players.length}/4</div><div class="players">${playersHtml(s)}</div>${s.is_host?`<button class="btn" id="start" ${s.players.length<2?'disabled':''}>${s.players.length<2?'あと1人で開始':`${s.players.length}人でゲーム開始`}</button>`:''}</div>`;if($('#copy'))$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(url);toast('参加URLをコピーしました')}catch{toast(url)}};if($('#start'))$('#start').onclick=()=>send('start')}
function render(s){if(s.stage==='lobby'){gameMounted=false;resetInput();$('#game').innerHTML='';$('#game').style.display='none';$('#lobby').style.display='block';renderLobby(s);return}lobbySig='';$('#lobby').style.display='none';$('#game').style.display='block';if(!gameMounted)mountGame();updateGame(s)}function bindHoldButton(b){let k=b.dataset.key,on=e=>{e.preventDefault();if(b.disabled)return;try{b.setPointerCapture(e.pointerId)}catch{}b.classList.add('on');setInput(k,true);if(k==='shoot')send('shoot')},off=e=>{e.preventDefault();b.classList.remove('on');setInput(k,false);try{if(b.hasPointerCapture(e.pointerId))b.releasePointerCapture(e.pointerId)}catch{}};b.addEventListener('pointerdown',on,{passive:false});b.addEventListener('pointerup',off,{passive:false});b.addEventListener('pointercancel',off,{passive:false});b.addEventListener('lostpointercapture',()=>{b.classList.remove('on');setInput(k,false)});b.addEventListener('contextmenu',e=>e.preventDefault());b.addEventListener('selectstart',e=>e.preventDefault());b.addEventListener('dragstart',e=>e.preventDefault())}
function mountGame(){gameMounted=true;$('#game').innerHTML=`<div class="card gameCard gameNoSelect"><div class="hudTop"><div id="scoreboard" class="scoreboard"></div></div><div class="landscapeHint">📱 横画面にすると遊びやすいよ</div><div class="canvasWrap" id="canvasWrap"><canvas id="cv" width="1000" height="640"></canvas><div class="banner" id="banner"></div><div class="killfeed" id="killfeed"></div><div class="reactionToast" id="reactionToast"></div></div><div class="controls" id="controls"><div class="dpad"><button class="ctrl up" data-key="up">▲</button><button class="ctrl left" data-key="left">◀</button><button class="ctrl down" data-key="down">▼</button><button class="ctrl right" data-key="right">▶</button></div><div class="rightControls"><button class="shoot" data-key="shoot"><span>💥</span>FIRE</button><button class="itemBtn" id="itemBtn" disabled>ITEM －</button></div></div><div class="spectator" id="spectator">👀 観戦中 <span>次ラウンドで復帰</span></div><div class="itemLegend"><span>⚡ レーザー</span><span>🔱 ショットガン</span><span>🛡️ シールド</span><span>💣 地雷</span></div><div class="reactions">${['🔥','😂','💥','😭','👏'].map(e=>`<button class="react" data-react="${e}">${e}</button>`).join('')}</div><button class="btn" id="again" style="display:none">ロビーに戻る</button></div>`;$$('[data-key]').forEach(bindHoldButton);$('#itemBtn').addEventListener('click',e=>{e.preventDefault();send('use_item')});$('#itemBtn').addEventListener('contextmenu',e=>e.preventDefault());$$('[data-react]').forEach(b=>b.onclick=()=>send('reaction',{emoji:b.dataset.react}));$('#again').onclick=()=>send('reset');$('#game').addEventListener('contextmenu',e=>{if(e.target.closest('.controls'))e.preventDefault()});$('#game').addEventListener('selectstart',e=>{if(e.target.closest('.controls'))e.preventDefault()})}
function updateGame(s){$('#scoreboard').innerHTML=scores(s);let b=$('#banner'),me=s.players.find(p=>p.id===s.player_id),dead=!!(me&&!me.alive),controls=$('#controls'),spectator=$('#spectator'),itemBtn=$('#itemBtn');if(dead){if(controls)controls.style.display='none';spectator?.classList.add('on');resetInput()}else{if(controls)controls.style.display='grid';spectator?.classList.remove('on')}if(itemBtn){let it=me?.item;if(it&&ITEM[it]){itemBtn.disabled=false;itemBtn.classList.add('ready');itemBtn.textContent=`${ITEM[it][0]} ${ITEM[it][1]} を使う`}else{itemBtn.disabled=true;itemBtn.classList.remove('ready');itemBtn.textContent='ITEM －'}}if(s.stage==='countdown')b.innerHTML=`<div class="big">${Math.max(1,Math.ceil(s.countdown))}</div><div class="sub">ROUND ${s.round}</div>`;else if(s.stage==='round_end')b.innerHTML=`<div class="big" style="font-size:54px">${esc(s.message)}</div><div class="sub">NEXT ROUND...</div>`;else if(s.stage==='finished'){b.innerHTML=`<div class="big" style="font-size:54px">${esc(s.message)}</div><div class="sub">GAME SET</div>`;$('#again').style.display=s.is_host?'block':'none'}else if(dead)b.innerHTML=`<div class="big" style="font-size:48px">💥</div><div class="sub">撃破された！ 観戦中</div>`;else b.innerHTML='';$('#reactionToast').innerHTML=(s.reactions||[]).map(r=>`<div class="reactionItem"><b>${r.emoji}</b>${esc(r.sender)}</div>`).join('');$('#killfeed').innerHTML=(s.killfeed||[]).map(k=>`<div class="killItem">${esc(k.text)}</div>`).join('');let shake=(s.effects||[]).some(e=>e.kind==='explosion'&&e.ttl>.42),wrap=$('#canvasWrap');if(wrap)wrap.style.transform=shake?`translate(${(Math.random()*8-4).toFixed(1)}px,${(Math.random()*8-4).toFixed(1)}px)`:'translate(0,0)';draw(s)}
function draw(s){let c=$('#cv');if(!c)return;let x=c.getContext('2d');x.clearRect(0,0,1000,640);x.fillStyle='#080b10';x.fillRect(0,0,1000,640);x.strokeStyle='#34445a';x.lineWidth=8;x.strokeRect(4,4,992,632);x.fillStyle='#28364a';for(let w of s.walls)x.fillRect(w.x,w.y,w.w,w.h);for(let item of s.pickups||[]){let m=ITEM[item.kind]||['?',''];x.save();x.translate(item.x,item.y);x.beginPath();x.arc(0,0,19,0,Math.PI*2);x.fillStyle='rgba(20,29,43,.94)';x.fill();x.strokeStyle='#d7edff';x.lineWidth=2;x.stroke();x.font='22px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText(m[0],0,1);x.restore()}for(let mine of s.mines||[]){x.save();x.translate(mine.x,mine.y);x.beginPath();x.arc(0,0,12,0,Math.PI*2);x.fillStyle=mine.armed?'#ff715e':'#6c7480';x.fill();x.strokeStyle='#16191e';x.lineWidth=3;x.stroke();if(mine.armed){x.beginPath();x.arc(0,0,18,0,Math.PI*2);x.strokeStyle='rgba(255,113,94,.45)';x.lineWidth=2;x.stroke()}x.restore()}for(let bullet of s.bullets){let o=s.players.find(p=>p.id===bullet.owner_id);x.beginPath();x.arc(bullet.x,bullet.y,bullet.kind==='shotgun'?5:7,0,Math.PI*2);x.fillStyle=o?.color||'#fff';x.shadowColor=x.fillStyle;x.shadowBlur=16;x.fill();x.shadowBlur=0}for(let p of s.players){x.save();x.translate(p.x,p.y);x.rotate(p.angle);x.globalAlpha=p.alive?1:.18;x.fillStyle=p.color;x.fillRect(-20,-15,40,30);x.fillStyle='#0b1118';x.fillRect(-14,-8,28,16);x.fillStyle=p.color;x.fillRect(3,-5,30,10);x.beginPath();x.arc(0,0,8,0,Math.PI*2);x.fill();x.restore();if(p.shield&&p.alive){x.beginPath();x.arc(p.x,p.y,29,0,Math.PI*2);x.strokeStyle='#9eeeff';x.lineWidth=4;x.shadowColor='#64e5ff';x.shadowBlur=14;x.stroke();x.shadowBlur=0}x.font='700 13px system-ui';x.textAlign='center';x.fillStyle=p.alive?'#fff':'#738093';x.fillText(p.name,p.x,p.y-30);if(p.item&&p.alive){x.font='18px system-ui';x.fillText((ITEM[p.item]||['?'])[0],p.x+27,p.y-23)}}for(let e of s.effects||[]){let phase=Math.max(0,Math.min(1,e.ttl/.75));if(e.kind==='laser'){x.save();x.strokeStyle=e.color||'#fff';x.lineWidth=7;x.shadowColor=x.strokeStyle;x.shadowBlur=22;x.beginPath();x.moveTo(e.x1,e.y1);x.lineTo(e.x2,e.y2);x.stroke();x.restore()}else if(e.kind==='explosion'){let r=20+(1-phase)*55;x.save();x.globalAlpha=Math.min(1,phase*1.5);let g=x.createRadialGradient(e.x,e.y,2,e.x,e.y,r);g.addColorStop(0,'#fff8cf');g.addColorStop(.25,'#ffcf52');g.addColorStop(.6,'#ff7043');g.addColorStop(1,'rgba(255,50,30,0)');x.fillStyle=g;x.beginPath();x.arc(e.x,e.y,r,0,Math.PI*2);x.fill();x.restore()}else if(e.kind==='shield_break'||e.kind==='shield_on'){x.save();x.globalAlpha=phase;x.strokeStyle='#a8f2ff';x.lineWidth=5;x.beginPath();x.arc(e.x,e.y,28+(1-phase)*28,0,Math.PI*2);x.stroke();x.restore()}else if(e.kind==='pickup'){x.save();x.globalAlpha=phase;x.font='30px system-ui';x.textAlign='center';x.fillText(e.text||'✨',e.x,e.y-30-(1-phase)*18);x.restore()}else if(e.kind==='muzzle'){x.save();x.globalAlpha=phase;x.fillStyle='#fff0a8';x.beginPath();x.arc(e.x,e.y,10+(1-phase)*10,0,Math.PI*2);x.fill();x.restore()}}}
const keyMap={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',' ':'shoot',e:'item',E:'item'};addEventListener('keydown',e=>{let k=keyMap[e.key];if(!k||!gameMounted)return;e.preventDefault();if(k==='item'){if(!e.repeat)send('use_item');return}if(!input[k]){setInput(k,true);if(k==='shoot')send('shoot')}});addEventListener('keyup',e=>{let k=keyMap[e.key];if(!k||!gameMounted||k==='item')return;e.preventDefault();setInput(k,false)});addEventListener('blur',resetInput);document.addEventListener('visibilitychange',()=>{if(document.hidden)resetInput()});if(parts[0]==='host'&&parts[1]){code=parts[1];hostInit()}else if(parts[0]==='join'&&parts[1]){code=parts[1];joinInit()}else show('home');
</script></body></html>
