<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090b10">
<title>BOUNCE TANKS</title>
<style>
:root{--bg:#090b10;--card:#121722;--card2:#1a2130;--line:#2b3445;--txt:#f7fbff;--muted:#9aa7b9;--accent:#64e5ff;--danger:#ff6d8d;--ok:#8cff8a;--warn:#ffd15c;--r:22px}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 15% 0,#14263a 0,transparent 34%),radial-gradient(circle at 100% 35%,#2a1727 0,transparent 26%),var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}body{min-height:100svh;overscroll-behavior:none}.app{max-width:900px;margin:auto;padding:16px 14px 42px}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brandMain{display:flex;align-items:center;gap:10px}.logo{width:48px;height:48px;border:1px solid #476078;border-radius:14px;background:linear-gradient(145deg,#1a2838,#0c1119);display:grid;place-items:center;font-size:25px;box-shadow:inset 0 0 20px #15283a}.brand h1{font-size:18px;letter-spacing:.13em;margin:0}.brand small{color:var(--muted)}.pill{border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900;color:#dce8f5;background:#111722}.screen{display:none}.screen.on{display:block}.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.018));border-radius:var(--r);padding:17px;margin-bottom:12px;box-shadow:0 18px 55px rgba(0,0,0,.27)}.hero{padding:25px 20px}.eyebrow,.smallcaps{font-size:11px;letter-spacing:.14em;font-weight:1000;color:var(--muted)}.hero h2{font-size:clamp(30px,7vw,50px);line-height:1.05;letter-spacing:-.045em;margin:9px 0 12px}.hero p,.hint{color:#ced7e2;line-height:1.7}.hint{font-size:13px}.btn{width:100%;border:0;border-radius:15px;padding:14px 16px;background:#f5fbff;color:#0a1018;font-weight:1000;margin-top:9px;font-size:15px}.btn.secondary{background:var(--card2);color:#fff;border:1px solid var(--line)}.btn.ghost{background:transparent;color:#d7e1eb;border:1px dashed var(--line)}.btn:disabled{opacity:.38}input,select{width:100%;background:#0c1119;color:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;font:inherit;outline:none}label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.code{font-size:62px;font-weight:1000;letter-spacing:.08em;text-align:center;margin:10px 0}.qr{display:block;width:min(230px,68vw);aspect-ratio:1;margin:14px auto;background:#fff;padding:9px;border-radius:18px}.copyline{display:grid;grid-template-columns:1fr 105px;gap:8px}.players{display:grid;gap:8px;margin-top:10px}.player{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:#0d121a}.dot{width:11px;height:11px;border-radius:50%;box-shadow:0 0 12px currentColor}.hostBadge{margin-left:auto;font-size:9px;border:1px solid var(--line);border-radius:999px;padding:4px 7px;color:var(--muted)}.center{text-align:center}.scoreboard{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px}.scoreChip{flex:0 0 auto;border:1px solid var(--line);border-radius:13px;padding:8px 11px;background:#0d121a;font-size:12px}.scoreChip strong{font-size:17px;margin-left:5px}.canvasWrap{position:relative;border:1px solid #35445b;border-radius:20px;overflow:hidden;background:#080b10;box-shadow:0 25px 70px rgba(0,0,0,.35);touch-action:none}.canvasWrap canvas{display:block;width:100%;height:auto;aspect-ratio:1000/640;background:#080b10}.banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;text-align:center;pointer-events:none;text-shadow:0 4px 18px #000}.banner .big{font-size:clamp(48px,16vw,110px);font-weight:1000;letter-spacing:-.08em;line-height:.9}.banner .sub{font-size:14px;font-weight:1000;margin-top:8px}.gameCard,.canvasWrap,.controls,.dpad,.ctrl,.shoot,.reactions,.react{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;touch-action:none}.dpad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,64px);gap:7px;touch-action:none}.ctrl,.shoot{border:1px solid #33445a;background:#111a27;color:#fff;border-radius:18px;font-size:25px;font-weight:1000;touch-action:none;-webkit-appearance:none;appearance:none}.ctrl.on,.shoot.on{transform:scale(.97);background:#24334a}.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}.shoot{font-size:18px;background:linear-gradient(145deg,#3d1720,#241017);border-color:#683141;min-height:135px}.shoot span{display:block;font-size:34px}.spectatorBar{display:none;margin-top:12px;border:1px solid #3a4c63;border-radius:16px;padding:12px 14px;text-align:center;background:rgba(15,23,34,.92);font-weight:900}.spectatorBar small{display:block;margin-top:4px;color:var(--muted);font-weight:700}.reactions{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}.react{border:1px solid var(--line);background:#171f2c;color:#fff;border-radius:999px;padding:8px 12px;font-size:18px;touch-action:manipulation}.reactionToast{position:absolute;right:12px;top:12px;z-index:6;display:grid;gap:6px;pointer-events:none}.reactionItem{background:rgba(7,10,15,.8);border:1px solid #334055;border-radius:999px;padding:7px 10px;font-size:12px;backdrop-filter:blur(7px)}.reactionItem b{font-size:18px;margin-right:5px}.landscapeHint{display:none;color:var(--warn);font-size:12px;text-align:center;margin:8px 0}.footer{text-align:center;color:#687488;font-size:11px;line-height:1.6;margin-top:18px}.status{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#fff;color:#111;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:900;opacity:0;pointer-events:none;transition:.2s;z-index:99}.status.show{opacity:1}@media(max-width:620px){.grid{grid-template-columns:1fr}.app{padding:12px 10px 32px}.card{padding:15px}.gameCard{padding:10px}.controls{gap:8px}.dpad{grid-template-rows:repeat(2,58px);gap:6px}.shoot{min-height:122px}.landscapeHint{display:block}}@media(orientation:landscape) and (max-height:540px){.brand{display:none}.app{max-width:100%;padding:6px}.gameCard{border:0;padding:0;background:transparent;box-shadow:none}.hudTop{position:absolute;left:8px;right:8px;top:8px;z-index:7;pointer-events:none}.scoreboard{justify-content:center}.controls{position:fixed;inset:auto 8px 8px 8px;z-index:8;grid-template-columns:220px 160px;justify-content:space-between;pointer-events:none}.controls>*{pointer-events:auto;opacity:.82}.dpad{grid-template-rows:repeat(2,52px)}.shoot{min-height:111px}.spectatorBar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:9;width:min(360px,70vw);margin:0}.landscapeHint{display:none}.reactions{position:fixed;right:12px;top:10px;z-index:9;flex-direction:column}.react{padding:5px 8px}.canvasWrap{border-radius:12px;height:calc(100svh - 12px)}.canvasWrap canvas{width:100%;height:100%;object-fit:contain}.footer{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="brand"><div class="brandMain"><div class="logo">💥</div><div><h1>BOUNCE TANKS</h1><small>跳ね返して、生き残れ。</small></div></div><div class="pill" id="conn">OFFLINE</div></div>
  <section id="home" class="screen on">
    <div class="card hero"><div class="eyebrow">REAL-TIME BATTLE</div><h2>撃て。跳ね返せ。<br>最後まで残れ。</h2><p>迷路の中で戦車バトル。弾は壁で反射し、自分の弾に当たることもあります。ホストもそのまま参戦できます。</p></div>
    <div class="card"><div class="grid"><div><label>あなたの名前</label><input id="hostName" maxlength="18" placeholder="ゆうと"></div><div><label>勝利条件</label><select id="targetScore"><option value="3">3点先取</option><option value="5" selected>5点先取</option><option value="7">7点先取</option></select></div></div><button class="btn" id="create">部屋をつくる</button></div>
    <div class="card"><label>4桁の部屋コードで参加</label><div class="copyline"><input id="joinCode" inputmode="numeric" maxlength="4" placeholder="1234"><button class="btn secondary" style="margin:0" id="goJoin">参加</button></div></div>
  </section>
  <section id="join" class="screen"><div class="card hero center"><div class="eyebrow">JOIN ROOM</div><div class="code" id="joinCodeBig"></div><p>名前を入力して戦場へ。</p></div><div class="card"><label>あなたの名前</label><input id="playerName" maxlength="18" placeholder="プレイヤー"><button class="btn" id="joinBtn">この部屋に参加</button><button class="btn ghost" onclick="location.href='/'">戻る</button></div></section>
  <section id="room" class="screen"><div id="lobby"></div><div id="game" style="display:none"></div></section>
  <div class="footer">BOUNCE TANKS prototype — オリジナルの迷路・UI・ルールで制作したWeb対戦ゲーム。</div>
</div>
<div class="status" id="toast"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const parts=location.pathname.split('/').filter(Boolean);let code=null,role=null,hostToken=null,playerId=null,playerToken=null,ws=null,state=null,retry=null,gameMounted=false,input={up:false,down:false,left:false,right:false,shoot:false};
const sk=(k,c)=>`bt_${k}_${c}`;function show(id){$$('.screen').forEach(x=>x.classList.remove('on'));$('#'+id).classList.add('on');scrollTo(0,0)}function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1600)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function api(url,opt={}){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});if(!r.ok){let j={};try{j=await r.json()}catch{}throw Error(j.detail||'通信に失敗しました')}return r.json()}
$('#create').onclick=async()=>{try{let d=await api('/api/rooms',{method:'POST',body:JSON.stringify({name:$('#hostName').value.trim()||'HOST',target_score:+$('#targetScore').value})});location.href=d.host_url}catch(e){toast(e.message)}};
$('#goJoin').onclick=()=>{let c=$('#joinCode').value.replace(/\D/g,'');if(c.length!==4)return toast('4桁のコードを入力してね');location.href='/join/'+c};
function hostInit(){let m=location.hash.match(/token=([^&]+)/);hostToken=m?decodeURIComponent(m[1]):localStorage.getItem(sk('host',code));if(!hostToken){location.href='/';return}localStorage.setItem(sk('host',code),hostToken);history.replaceState(null,'',`/host/${code}`);connect('host')}
async function joinInit(){show('join');$('#joinCodeBig').textContent=code;try{await api('/api/rooms/'+code)}catch(e){toast(e.message)}let saved=JSON.parse(localStorage.getItem(sk('player',code))||'null');if(saved?.player_id&&saved?.player_token){playerId=saved.player_id;playerToken=saved.player_token;connect('player');return}$('#joinBtn').onclick=async()=>{try{let d=await api(`/api/rooms/${code}/join`,{method:'POST',body:JSON.stringify({name:$('#playerName').value})});playerId=d.player_id;playerToken=d.player_token;localStorage.setItem(sk('player',code),JSON.stringify(d));connect('player')}catch(e){toast(e.message)}}}
function connect(r){role=r;show('room');if(ws)try{ws.close()}catch{}clearTimeout(retry);let proto=location.protocol==='https:'?'wss':'ws',url=`${proto}://${location.host}/ws/${code}?role=${r}&token=${encodeURIComponent(r==='host'?hostToken:playerToken)}`;if(r==='player')url+=`&player_id=${encodeURIComponent(playerId)}`;ws=new WebSocket(url);ws.onopen=()=>{$('#conn').textContent='LIVE';$('#conn').style.color='#8cff8a';sendInput()};ws.onclose=()=>{$('#conn').textContent='RECONNECT';$('#conn').style.color='';retry=setTimeout(()=>connect(r),1500)};ws.onmessage=e=>{let d=JSON.parse(e.data);if(d.type==='error')return toast(d.message);state=d;playerId=d.player_id||playerId;render(d)}}
function send(action,extra={}){if(ws?.readyState===1)ws.send(JSON.stringify({action,...extra}))}function sendInput(){send('input',{keys:input})}function setInput(k,v){if(input[k]===v)return;input[k]=v;sendInput()}function clearInput(){let changed=false;for(let k in input){if(input[k])changed=true;input[k]=false}if(changed)sendInput();$$('[data-key].on').forEach(b=>b.classList.remove('on'))}
function playersHtml(s){return s.players.map(p=>`<div class="player"><span class="dot" style="background:${p.color};color:${p.color}"></span><strong>${esc(p.name)}</strong>${p.id===s.host_player_id?'<span class="hostBadge">HOST</span>':''}</div>`).join('')}
function scores(s){return s.players.map(p=>`<div class="scoreChip" style="border-color:${p.color}66"><span style="color:${p.color}">●</span> ${esc(p.name)} <strong>${p.score}</strong>/${s.target_score}</div>`).join('')}
function render(s){if(s.stage==='lobby'){gameMounted=false;$('#game').innerHTML='';$('#game').style.display='none';$('#lobby').style.display='block';let url=location.origin+`/join/${s.code}`;$('#lobby').innerHTML=`<div class="card center"><div class="smallcaps">ROOM CODE</div><div class="code">${s.code}</div>${s.is_host?`<img class="qr" src="/room/${s.code}/qr?t=${Date.now()}"><div class="copyline"><input id="joinUrl" value="${esc(url)}" readonly><button class="btn secondary" id="copy" style="margin:0">コピー</button></div><p class="hint">QRコードかURLを友達に送って参加。</p>`:'<p class="hint">ホストがゲームを始めるまで待ってね。</p>'}</div><div class="card"><div class="smallcaps">PLAYERS ${s.players.length}/4</div><div class="players">${playersHtml(s)}</div>${s.is_host?`<button class="btn" id="start" ${s.players.length<2?'disabled':''}>${s.players.length<2?'あと1人で開始':`${s.players.length}人でゲーム開始`}</button>`:''}</div>`;if($('#copy'))$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(url);toast('参加URLをコピーしました')}catch{toast(url)}};if($('#start'))$('#start').onclick=()=>send('start');return}$('#lobby').style.display='none';$('#game').style.display='block';if(!gameMounted)mountGame();updateGame(s)}
function mountGame(){gameMounted=true;$('#game').innerHTML=`<div class="card gameCard"><div class="hudTop"><div id="scoreboard" class="scoreboard"></div></div><div class="landscapeHint">📱 横画面にすると遊びやすいよ</div><div class="canvasWrap"><canvas id="cv" width="1000" height="640"></canvas><div class="banner" id="banner"></div><div class="reactionToast" id="reactionToast"></div></div><div class="spectatorBar" id="spectatorBar">👀 観戦中<small>次のラウンドで自動的に復帰します</small></div><div class="controls" id="controls"><div class="dpad"><button class="ctrl up" data-key="up" aria-label="前進">▲</button><button class="ctrl left" data-key="left" aria-label="左旋回">◀</button><button class="ctrl down" data-key="down" aria-label="後退">▼</button><button class="ctrl right" data-key="right" aria-label="右旋回">▶</button></div><button class="shoot" data-key="shoot" aria-label="射撃"><span>💥</span>FIRE</button></div><div class="reactions">${['🔥','😂','💥','😭','👏'].map(e=>`<button class="react" data-react="${e}">${e}</button>`).join('')}</div><button class="btn" id="again" style="display:none">ロビーに戻る</button></div>`;let gameRoot=$('.gameCard');['contextmenu','selectstart','dragstart'].forEach(type=>gameRoot.addEventListener(type,e=>{if(e.target.closest('.canvasWrap,.controls,.reactions'))e.preventDefault()}));$$('[data-key]').forEach(b=>{let k=b.dataset.key;let on=e=>{e.preventDefault();try{b.setPointerCapture?.(e.pointerId)}catch{}b.classList.add('on');setInput(k,true);if(k==='shoot')send('shoot')},off=e=>{e.preventDefault();b.classList.remove('on');setInput(k,false)};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);b.addEventListener('contextmenu',e=>e.preventDefault());b.addEventListener('selectstart',e=>e.preventDefault())});$$('[data-react]').forEach(b=>b.onclick=()=>send('reaction',{emoji:b.dataset.react}));$('#again').onclick=()=>send('reset')}
function updateGame(s){$('#scoreboard').innerHTML=scores(s);let b=$('#banner'),me=s.players.find(p=>p.id===s.player_id),spectating=s.stage==='playing'&&me&&!me.alive,controls=$('#controls'),spectator=$('#spectatorBar');if(controls)controls.style.display=spectating?'none':'grid';if(spectator)spectator.style.display=spectating?'block':'none';if(spectating)clearInput();if(s.stage==='countdown')b.innerHTML=`<div class="big">${Math.max(1,Math.ceil(s.countdown))}</div><div class="sub">ROUND ${s.round}</div>`;else if(s.stage==='round_end')b.innerHTML=`<div class="big" style="font-size:54px">${esc(s.message)}</div><div class="sub">NEXT ROUND...</div>`;else if(s.stage==='finished'){b.innerHTML=`<div class="big" style="font-size:54px">${esc(s.message)}</div><div class="sub">GAME SET</div>`;$('#again').style.display=s.is_host?'block':'none'}else b.innerHTML='';$('#reactionToast').innerHTML=(s.reactions||[]).map(r=>`<div class="reactionItem"><b>${r.emoji}</b>${esc(r.sender)}</div>`).join('');draw(s)}
function draw(s){let c=$('#cv');if(!c)return;let x=c.getContext('2d');x.clearRect(0,0,1000,640);x.fillStyle='#080b10';x.fillRect(0,0,1000,640);x.strokeStyle='#34445a';x.lineWidth=8;x.strokeRect(4,4,992,632);x.fillStyle='#28364a';for(let w of s.walls)x.fillRect(w.x,w.y,w.w,w.h);for(let bullet of s.bullets){let o=s.players.find(p=>p.id===bullet.owner_id);x.beginPath();x.arc(bullet.x,bullet.y,7,0,Math.PI*2);x.fillStyle=o?.color||'#fff';x.shadowColor=x.fillStyle;x.shadowBlur=16;x.fill();x.shadowBlur=0}for(let p of s.players){x.save();x.translate(p.x,p.y);x.rotate(p.angle);x.globalAlpha=p.alive?1:.22;x.fillStyle=p.color;x.fillRect(-20,-15,40,30);x.fillStyle='#0b1118';x.fillRect(-14,-8,28,16);x.fillStyle=p.color;x.fillRect(3,-5,30,10);x.beginPath();x.arc(0,0,8,0,Math.PI*2);x.fill();x.restore();x.font='700 13px system-ui';x.textAlign='center';x.fillStyle=p.alive?'#fff':'#738093';x.fillText(p.name,p.x,p.y-28)}}
const keyMap={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',' ':'shoot'};addEventListener('keydown',e=>{let k=keyMap[e.key];if(!k||!gameMounted)return;e.preventDefault();let me=state?.players?.find(p=>p.id===state.player_id);if(state?.stage==='playing'&&me&&!me.alive)return;if(!input[k]){setInput(k,true);if(k==='shoot')send('shoot')}});addEventListener('keyup',e=>{let k=keyMap[e.key];if(!k||!gameMounted)return;e.preventDefault();setInput(k,false)});addEventListener('blur',clearInput);
if(parts[0]==='host'&&parts[1]){code=parts[1];hostInit()}else if(parts[0]==='join'&&parts[1]){code=parts[1];joinInit()}else show('home');
</script>
</body>
</html>
