<style>
:root{--bg:#090b10;--card:#121722;--card2:#1a2130;--line:#2b3445;--txt:#f7fbff;--muted:#9aa7b9;--accent:#64e5ff;--danger:#ff6d8d;--ok:#8cff8a;--warn:#ffd15c;--r:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 15% 0,#14263a 0,transparent 34%),radial-gradient(circle at 100% 35%,#2a1727 0,transparent 26%),var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}body{min-height:100svh;overscroll-behavior:none}.app{max-width:900px;margin:auto;padding:16px 14px 42px}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brandMain{display:flex;align-items:center;gap:10px}.logo{width:48px;height:48px;border:1px solid #476078;border-radius:14px;background:linear-gradient(145deg,#1a2838,#0c1119);display:grid;place-items:center;font-size:25px;box-shadow:inset 0 0 20px #15283a}.brand h1{font-size:18px;letter-spacing:.13em;margin:0}.brand small{color:var(--muted)}.pill{border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900;color:#dce8f5;background:#111722}.screen{display:none}.screen.on{display:block}.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.018));border-radius:var(--r);padding:17px;margin-bottom:12px;box-shadow:0 18px 55px rgba(0,0,0,.27)}.hero{padding:25px 20px}.eyebrow,.smallcaps{font-size:11px;letter-spacing:.14em;font-weight:1000;color:var(--muted)}.hero h2{font-size:clamp(30px,7vw,50px);line-height:1.05;letter-spacing:-.045em;margin:9px 0 12px}.hero p,.hint{color:#ced7e2;line-height:1.7}.hint{font-size:13px}.btn{width:100%;border:0;border-radius:15px;padding:14px 16px;background:#f5fbff;color:#0a1018;font-weight:1000;margin-top:9px;font-size:15px}.btn.secondary{background:var(--card2);color:#fff;border:1px solid var(--line)}.btn.ghost{background:transparent;color:#d7e1eb;border:1px dashed var(--line)}.btn.solo{background:linear-gradient(145deg,#8cff8a,#b8ffb7)}.btn:disabled{opacity:.38}input,select{width:100%;background:#0c1119;color:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;font:inherit;outline:none;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.code{font-size:62px;font-weight:1000;letter-spacing:.08em;text-align:center;margin:10px 0}.qr{display:block;width:min(230px,68vw);height:auto;aspect-ratio:1;margin:14px auto;background:#fff;padding:9px;border-radius:18px;image-rendering:pixelated}.copyline{display:grid;grid-template-columns:1fr 105px;gap:8px}.players{display:grid;gap:8px;margin-top:10px}.player{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:#0d121a}.dot{width:11px;height:11px;border-radius:50%;box-shadow:0 0 12px currentColor}.hostBadge,.botBadge{margin-left:auto;font-size:9px;border:1px solid var(--line);border-radius:999px;padding:4px 7px;color:var(--muted)}.center{text-align:center}.modeCards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modeCard{padding:16px;border:1px solid var(--line);border-radius:18px;background:#0d121a}.modeCard h3{margin:5px 0 7px}.modeCard p{font-size:12px;color:var(--muted);line-height:1.6;margin:0}.settingsBox{margin-top:12px;padding:13px;border:1px solid var(--line);border-radius:16px;background:#0b1018}.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.seg button{border:1px solid var(--line);border-radius:12px;padding:10px;background:#111722;color:#cbd5e1;font-weight:900}.seg button.on{background:#eaf8ff;color:#091019;border-color:#eaf8ff}.summary{font-size:13px;color:#dce6f1;margin-top:8px}.scoreboard{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px}.scoreChip{flex:0 0 auto;border:1px solid var(--line);border-radius:13px;padding:8px 11px;background:#0d121a;font-size:12px}.scoreChip strong{font-size:17px;margin-left:5px}.survivalHud{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.survChip{border:1px solid var(--line);border-radius:13px;padding:8px 12px;background:#0d121a;font-size:12px}.survChip strong{font-size:18px;margin-left:5px}.canvasWrap{position:relative;border:1px solid #35445b;border-radius:20px;overflow:hidden;background:#080b10;box-shadow:0 25px 70px rgba(0,0,0,.35);touch-action:none;transition:transform .04s}.canvasWrap canvas{display:block;width:100%;height:auto;aspect-ratio:1000/640;background:#080b10}.banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;text-align:center;pointer-events:none;text-shadow:0 4px 18px #000;white-space:nowrap}.banner .big{font-size:clamp(48px,16vw,110px);font-weight:1000;letter-spacing:-.08em;line-height:.9}.banner .sub{font-size:14px;font-weight:1000;margin-top:8px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;touch-action:none}.dpad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,64px);gap:7px}.rightControls{display:grid;grid-template-rows:1fr 54px;gap:7px}.ctrl,.shoot,.itemBtn,.react{border:1px solid #33445a;color:#fff;font-weight:1000;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none}.ctrl,.shoot,.itemBtn{background:#111a27;border-radius:18px}.ctrl{font-size:25px}.ctrl.on,.shoot.on,.itemBtn.on{transform:scale(.97);background:#24334a}.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}.shoot{font-size:18px;background:linear-gradient(145deg,#3d1720,#241017);border-color:#683141;min-height:74px}.shoot span{display:block;font-size:30px}.itemBtn{font-size:14px;background:linear-gradient(145deg,#1d2940,#111925);border-color:#40577b}.itemBtn.ready{box-shadow:0 0 20px rgba(100,229,255,.24);border-color:#64e5ff}.itemBtn:disabled{opacity:.35}.spectator{display:none;align-items:center;justify-content:center;gap:10px;margin-top:12px;padding:18px;border:1px dashed #516075;border-radius:18px;background:#0d121a;color:#dce7f4;font-weight:900}.spectator.on{display:flex}.reactions{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}.react{background:#171f2c;border-radius:999px;padding:8px 12px;font-size:18px}.reactionToast{position:absolute;right:12px;top:12px;z-index:7;display:grid;gap:6px;pointer-events:none}.reactionItem,.killItem{background:rgba(7,10,15,.82);border:1px solid #334055;border-radius:999px;padding:7px 10px;font-size:12px;backdrop-filter:blur(7px)}.reactionItem b{font-size:18px;margin-right:5px}.killfeed{position:absolute;left:12px;top:12px;z-index:7;display:grid;gap:6px;pointer-events:none}.killItem{border-radius:10px;color:#fff}.itemLegend{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:10px 0 0;color:#91a0b4;font-size:11px}.itemLegend span{border:1px solid var(--line);border-radius:999px;padding:5px 8px;background:#0c1119}.chatRow{display:none;grid-template-columns:minmax(0,1fr) minmax(110px,210px) 58px;gap:7px;align-items:center;margin-top:10px;padding:7px;border:1px solid var(--line);border-radius:14px;background:#0b1018}.chatRow.on{display:grid}.chatLine{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#dce6f2;font-size:12px;padding-left:5px}.chatLine.empty{color:#647184}.chatRow input{padding:9px 10px;border-radius:10px;font-size:12px}.chatSend{height:36px;border:1px solid var(--line);border-radius:10px;background:#172131;color:#fff;font-weight:900}.landscapeHint{display:none;color:var(--warn);font-size:12px;text-align:center;margin:8px 0}.footer{text-align:center;color:#687488;font-size:11px;line-height:1.6;margin-top:18px}.status{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#fff;color:#111;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:900;opacity:0;pointer-events:none;transition:.2s;z-index:99}.status.show{opacity:1}.gameNoSelect,.gameNoSelect *:not(input){-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important;-webkit-user-drag:none!important}.resultGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.resultCell{padding:12px;border:1px solid var(--line);border-radius:14px;background:#0d121a;text-align:center}.resultCell strong{display:block;font-size:24px;margin-top:3px}.gameActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.smoothBadge{display:inline-flex;align-items:center;gap:6px;border:1px solid #31445b;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:900;color:#9eeeff;background:#0b141f;margin-top:8px}.canvasWrap{will-change:transform}.canvasWrap canvas{will-change:contents}
@media(max-width:620px){.grid,.modeCards{grid-template-columns:1fr}.app{padding:12px 10px 32px}.card{padding:15px}.gameCard{padding:10px}.controls{gap:8px}.dpad{grid-template-rows:repeat(2,58px);gap:6px}.rightControls{grid-template-rows:1fr 48px}.landscapeHint{display:block}.chatRow{grid-template-columns:minmax(0,1fr) 120px 50px}.chatLine{font-size:11px}.resultGrid{grid-template-columns:1fr 1fr 1fr}}
@media(orientation:landscape) and (max-height:540px){.brand{display:none}.app{max-width:100%;padding:6px}.gameCard{border:0;padding:0;background:transparent;box-shadow:none}.hudTop{position:absolute;left:8px;right:8px;top:8px;z-index:8;pointer-events:none}.scoreboard,.survivalHud{justify-content:center}.controls{position:fixed;inset:auto 8px 8px 8px;z-index:9;grid-template-columns:220px 170px;justify-content:space-between;pointer-events:none}.controls>*{pointer-events:auto;opacity:.85}.dpad{grid-template-rows:repeat(2,52px)}.rightControls{grid-template-rows:72px 38px}.shoot{min-height:72px}.itemBtn{border-radius:13px}.spectator{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9;margin:0;background:rgba(13,18,26,.88);padding:11px 18px}.landscapeHint,.itemLegend{display:none}.reactions{position:fixed;right:12px;top:10px;z-index:10;flex-direction:column}.react{padding:5px 8px}.canvasWrap{border-radius:12px;height:calc(100svh - 58px)}.canvasWrap canvas{width:100%;height:100%;object-fit:contain}.chatRow{margin-top:4px;height:42px}.footer{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="brand"><div class="brandMain"><div class="logo">💥</div><div><h1>BOUNCE TANKS</h1><small>跳ね返して、生き残れ。</small></div></div><div class="pill" id="conn">OFFLINE</div></div>

  <section id="home" class="screen on">
    <div class="card hero"><div class="eyebrow">BOUNCE TANKS v4</div><h2>1人でも。<br>みんなでも。</h2><p>壁で跳ね返る弾を使った迷路戦車バトル。v4では操作レスポンスと描画の滑らかさを重点改善。</p></div>
    <div class="card">
      <label>あなたの名前</label><input id="hostName" maxlength="18" placeholder="ゆうと">
      <div class="modeCards" style="margin-top:12px">
        <div class="modeCard"><div class="smallcaps">SOLO</div><h3>🧟 SURVIVAL</h3><p>CPUを倒してWAVEを進める。倒されるまでエンドレス。</p><button class="btn solo" id="createSolo">1人で遊ぶ</button></div>
        <div class="modeCard"><div class="smallcaps">MULTIPLAYER</div><h3>⚔️ BATTLE</h3><p>2〜4人で対戦。アイテムあり／なしはロビーで選択。</p><div style="margin-top:9px"><label>勝利条件</label><select id="targetScore"><option value="3">3点先取</option><option value="5" selected>5点先取</option><option value="7">7点先取</option></select></div><button class="btn" id="createBattle">みんなで遊ぶ</button></div>
      </div>
    </div>
    <div class="card"><label>4桁の部屋コードで参加</label><div class="copyline"><input id="joinCode" inputmode="numeric" maxlength="4" placeholder="1234"><button class="btn secondary" style="margin:0" id="goJoin">参加</button></div></div>
  </section>

  <section id="join" class="screen"><div class="card hero center"><div class="eyebrow">JOIN ROOM</div><div class="code" id="joinCodeBig"></div><p>名前を入力して戦場へ。</p></div><div class="card"><label>あなたの名前</label><input id="playerName" maxlength="18" placeholder="プレイヤー"><button class="btn" id="joinBtn">この部屋に参加</button><button class="btn ghost" onclick="location.href='/'">戻る</button></div></section>
  <section id="room" class="screen"><div id="lobby"></div><div id="game" style="display:none"></div></section>
  <div class="footer">BOUNCE TANKS v4 — SMOOTH CONTROL</div>
</div>
<div class="status" id="toast"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],parts=location.pathname.split('/').filter(Boolean);
let code=null,role=null,hostToken=null,playerId=null,playerToken=null,ws=null,state=null,retry=null,gameMounted=false,lobbySig='',input={up:false,down:false,left:false,right:false,shoot:false};
let visualPlayers=new Map(),visualBullets=new Map(),rafId=0,lastFrameAt=performance.now(),spawnKey='',localMuzzleUntil=0,scoreSig='',survSig='',reactionSig='',killSig='',chatSig='';
const ITEM={laser:['⚡','LASER'],shotgun:['🔱','SHOTGUN'],shield:['🛡️','SHIELD'],mine:['💣','MINE']},sk=(k,c)=>`bt_${k}_${c}`;
const TANK_R=20,TANK_SPEED=190,TURN_SPEED=2.8;
function show(id){$$('.screen').forEach(x=>x.classList.remove('on'));$('#'+id).classList.add('on');scrollTo(0,0)}
function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1600)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(sec){sec=Math.max(0,Math.floor(sec||0));return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`}
function angleDelta(target,current){return (target-current+Math.PI)%(Math.PI*2)-Math.PI}
function expAlpha(rate,dt){return 1-Math.exp(-rate*Math.min(.05,Math.max(0,dt)))}
function hitRectVisual(cx,cy,radius,r){let nx=Math.min(Math.max(cx,r.x),r.x+r.w),ny=Math.min(Math.max(cy,r.y),r.y+r.h);return (cx-nx)**2+(cy-ny)**2<radius**2}
function blockedVisual(x,y,walls){if(x-TANK_R<0||x+TANK_R>1000||y-TANK_R<0||y+TANK_R>640)return true;return (walls||[]).some(r=>hitRectVisual(x,y,TANK_R,r))}
function goHome(){resetInput();clearTimeout(retry);retry=null;if(ws){ws.onclose=null;try{ws.close()}catch{}ws=null}stopRenderLoop();location.href='/'}
function syncVisualState(s){
  let key=s.mode==='battle'?`b:${s.round}`:`s:${s.survival?.wave||0}`,snapRound=key!==spawnKey;if(snapRound)spawnKey=key;
  let ids=new Set();
  for(let p of s.players||[]){
    ids.add(p.id);let v=visualPlayers.get(p.id);
    if(!v||snapRound||v.alive!==p.alive){v={x:p.x,y:p.y,a:p.angle,tx:p.x,ty:p.y,ta:p.angle,alive:p.alive};visualPlayers.set(p.id,v)}
    else{v.tx=p.x;v.ty=p.y;v.ta=p.angle;v.alive=p.alive}
  }
  for(let id of [...visualPlayers.keys()])if(!ids.has(id))visualPlayers.delete(id);
  let bids=new Set();
  for(let b of s.bullets||[]){bids.add(b.id);let v=visualBullets.get(b.id);if(!v){v={x:b.x,y:b.y,tx:b.x,ty:b.y};visualBullets.set(b.id,v)}else{v.tx=b.x;v.ty=b.y}}
  for(let id of [...visualBullets.keys()])if(!bids.has(id))visualBullets.delete(id);
}
function advanceVisual(dt){
  if(!state||!gameMounted)return;
  for(let p of state.players||[]){
    let v=visualPlayers.get(p.id);if(!v)continue;
    if(p.id===state.player_id&&p.alive&&state.stage==='playing'){
      let turn=(input.right?1:0)-(input.left?1:0);
      v.a=(v.a+turn*TURN_SPEED*dt)%(Math.PI*2);
      let move=(input.up?1:0)-(input.down?1:0),speed=TANK_SPEED*(move<0?.72:1),dx=Math.cos(v.a)*speed*move*dt,dy=Math.sin(v.a)*speed*move*dt;
      if(!blockedVisual(v.x+dx,v.y,state.walls))v.x+=dx;
      if(!blockedVisual(v.x,v.y+dy,state.walls))v.y+=dy;
      let err=Math.hypot(v.tx-v.x,v.ty-v.y);
      if(err>95){v.x=v.tx;v.y=v.ty}else{let moving=!!(input.up||input.down||input.left||input.right),a=expAlpha(moving?2.0:8.5,dt);v.x+=(v.tx-v.x)*a;v.y+=(v.ty-v.y)*a}
      let aa=expAlpha((input.left||input.right)?1.7:9,dt);v.a+=angleDelta(v.ta,v.a)*aa;
    }else{
      let a=expAlpha(p.bot?13:17,dt);v.x+=(v.tx-v.x)*a;v.y+=(v.ty-v.y)*a;v.a+=angleDelta(v.ta,v.a)*a;
    }
  }
  for(let v of visualBullets.values()){let a=expAlpha(24,dt);v.x+=(v.tx-v.x)*a;v.y+=(v.ty-v.y)*a}
}
function startRenderLoop(){if(rafId)return;lastFrameAt=performance.now();const loop=now=>{rafId=requestAnimationFrame(loop);let dt=Math.min(.04,(now-lastFrameAt)/1000);lastFrameAt=now;advanceVisual(dt);if(state&&gameMounted)draw(state)};rafId=requestAnimationFrame(loop)}
function stopRenderLoop(){if(rafId){cancelAnimationFrame(rafId);rafId=0}visualPlayers.clear();visualBullets.clear();spawnKey=''}
function instantFireFeedback(){localMuzzleUntil=performance.now()+110}
async function api(url,opt={}){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});if(!r.ok){let j={};try{j=await r.json()}catch{}throw Error(j.detail||'通信に失敗しました')}return r.json()}
async function createRoom(mode){try{let d=await api('/api/rooms',{method:'POST',body:JSON.stringify({name:$('#hostName').value.trim()||'HOST',target_score:+$('#targetScore').value||5,mode})});location.href=d.host_url}catch(e){toast(e.message)}}
$('#createBattle').onclick=()=>createRoom('battle');$('#createSolo').onclick=()=>createRoom('survival');
$('#goJoin').onclick=()=>{let c=$('#joinCode').value.replace(/\D/g,'');if(c.length!==4)return toast('4桁のコードを入力してね');location.href='/join/'+c};
function hostInit(){let m=location.hash.match(/token=([^&]+)/);hostToken=m?decodeURIComponent(m[1]):localStorage.getItem(sk('host',code));if(!hostToken){location.href='/';return}localStorage.setItem(sk('host',code),hostToken);history.replaceState(null,'',`/host/${code}`);connect('host')}
async function joinInit(){show('join');$('#joinCodeBig').textContent=code;try{let info=await api('/api/rooms/'+code);if(info.mode!=='battle')throw Error('この部屋は1人用です')}catch(e){toast(e.message)}let saved=JSON.parse(localStorage.getItem(sk('player',code))||'null');if(saved?.player_id&&saved?.player_token){playerId=saved.player_id;playerToken=saved.player_token;connect('player');return}$('#joinBtn').onclick=async()=>{try{let d=await api(`/api/rooms/${code}/join`,{method:'POST',body:JSON.stringify({name:$('#playerName').value})});playerId=d.player_id;playerToken=d.player_token;localStorage.setItem(sk('player',code),JSON.stringify(d));connect('player')}catch(e){toast(e.message)}}}
function connect(r){role=r;show('room');if(ws)try{ws.close()}catch{}clearTimeout(retry);let proto=location.protocol==='https:'?'wss':'ws',url=`${proto}://${location.host}/ws/${code}?role=${r}&token=${encodeURIComponent(r==='host'?hostToken:playerToken)}`;if(r==='player')url+=`&player_id=${encodeURIComponent(playerId)}`;ws=new WebSocket(url);ws.onopen=()=>{$('#conn').textContent='LIVE';$('#conn').style.color='#8cff8a';sendInput()};ws.onclose=()=>{$('#conn').textContent='RECONNECT';$('#conn').style.color='';retry=setTimeout(()=>connect(r),1500)};ws.onmessage=e=>{let d=JSON.parse(e.data);if(d.type==='error')return toast(d.message);state=d;playerId=d.player_id||playerId;render(d)}}
function send(action,extra={}){if(ws?.readyState===1)ws.send(JSON.stringify({action,...extra}))}
function sendInput(){send('input',{keys:input})}
function setInput(k,v){if(input[k]===v)return;input[k]=v;sendInput()}
function resetInput(){let changed=false;for(let k in input){if(input[k])changed=true;input[k]=false}$$('[data-key]').forEach(b=>b.classList.remove('on'));if(changed)sendInput()}
function humanList(s){return s.players.filter(p=>!p.bot)}
function playersHtml(s){return s.players.filter(p=>!p.bot).map(p=>`<div class="player"><span class="dot" style="background:${p.color};color:${p.color}"></span><strong>${esc(p.name)}</strong>${p.id===s.host_player_id?'<span class="hostBadge">HOST</span>':''}</div>`).join('')}
function scores(s){return humanList(s).map(p=>`<div class="scoreChip" style="border-color:${p.color}66"><span style="color:${p.color}">●</span> ${esc(p.name)} <strong>${p.score}</strong>/${s.target_score}</div>`).join('')}
function settingsHtml(s){let status=s.items_enabled?'あり':'なし';if(!s.is_host)return `<div class="settingsBox"><div class="smallcaps">GAME SETTINGS</div><div class="summary">${s.mode==='battle'?`${s.target_score}点先取・`:''}アイテム ${status}</div></div>`;return `<div class="settingsBox"><div class="smallcaps">ITEMS</div><div class="seg"><button id="itemsOff" class="${!s.items_enabled?'on':''}">なし</button><button id="itemsOn" class="${s.items_enabled?'on':''}">あり</button></div><div class="summary">${s.items_enabled?'⚡🔱🛡️💣 がマップに出現':'通常弾だけの純粋な反射バトル'}</div></div>`}
function bindLobbySettings(){if($('#itemsOff'))$('#itemsOff').onclick=()=>send('set_items',{enabled:false});if($('#itemsOn'))$('#itemsOn').onclick=()=>send('set_items',{enabled:true})}
function renderLobby(s){let sig=`${s.players.filter(p=>!p.bot).map(p=>p.id+':'+p.name).join('|')}|${s.is_host}|${s.target_score}|${s.items_enabled}|${s.mode}`;if(sig===lobbySig)return;lobbySig=sig;
  if(s.mode==='survival'){$('#lobby').innerHTML=`<div class="card hero center"><div class="eyebrow">SOLO SURVIVAL</div><h2 style="font-size:38px">WAVEを<br>生き残れ。</h2><p>CPUを倒すほど敵が増えて強くなります。自分の弾での自爆にも注意。</p><div class="smoothBadge">⚡ v4 SMOOTH CONTROL</div></div><div class="card"><div class="player"><span class="dot" style="background:${humanList(s)[0]?.color};color:${humanList(s)[0]?.color}"></span><strong>${esc(humanList(s)[0]?.name||'PLAYER')}</strong><span class="hostBadge">PLAYER</span></div>${settingsHtml(s)}${s.is_host?'<button class="btn solo" id="start">SURVIVAL開始</button>':''}<button class="btn ghost" id="menuBackLobby">← メインメニューに戻る</button></div>`;bindLobbySettings();if($('#start'))$('#start').onclick=()=>send('start');if($('#menuBackLobby'))$('#menuBackLobby').onclick=goHome;return}
  let url=location.origin+`/join/${s.code}`;$('#lobby').innerHTML=`<div class="card center"><div class="smallcaps">ROOM CODE</div><div class="code">${s.code}</div>${s.is_host?`<img class="qr" src="/room/${s.code}/qr" alt="参加用QRコード"><div class="copyline"><input id="joinUrl" value="${esc(url)}" readonly><button class="btn secondary" id="copy" style="margin:0">コピー</button></div><p class="hint">QRコードかURLを友達に送って参加。</p>`:'<p class="hint">ホストがゲームを始めるまで待ってね。</p>'}</div><div class="card"><div class="smallcaps">PLAYERS ${humanList(s).length}/4</div><div class="players">${playersHtml(s)}</div>${settingsHtml(s)}${s.is_host?`<button class="btn" id="start" ${humanList(s).length<2?'disabled':''}>${humanList(s).length<2?'あと1人で開始':`${humanList(s).length}人でゲーム開始`}</button>`:''}</div>`;
  bindLobbySettings();if($('#copy'))$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(url);toast('参加URLをコピーしました')}catch{toast(url)}};if($('#start'))$('#start').onclick=()=>send('start')}
function render(s){if(s.stage==='lobby'){gameMounted=false;resetInput();stopRenderLoop();$('#game').innerHTML='';$('#game').style.display='none';$('#lobby').style.display='block';renderLobby(s);return}lobbySig='';$('#lobby').style.display='none';$('#game').style.display='block';if(!gameMounted)mountGame(s);updateGame(s)}
function bindHoldButton(b){let k=b.dataset.key,on=e=>{e.preventDefault();if(b.disabled)return;try{b.setPointerCapture(e.pointerId)}catch{}b.classList.add('on');setInput(k,true);if(k==='shoot'){instantFireFeedback();send('shoot')}},off=e=>{e.preventDefault();b.classList.remove('on');setInput(k,false);try{if(b.hasPointerCapture(e.pointerId))b.releasePointerCapture(e.pointerId)}catch{}};b.addEventListener('pointerdown',on,{passive:false});b.addEventListener('pointerup',off,{passive:false});b.addEventListener('pointercancel',off,{passive:false});b.addEventListener('lostpointercapture',()=>{b.classList.remove('on');setInput(k,false)});b.addEventListener('contextmenu',e=>e.preventDefault());b.addEventListener('selectstart',e=>e.preventDefault());b.addEventListener('dragstart',e=>e.preventDefault())}
function mountGame(s){gameMounted=true;let battle=s.mode==='battle';$('#game').innerHTML=`<div class="card gameCard gameNoSelect"><div class="hudTop"><div id="scoreboard" class="scoreboard"></div><div id="survivalHud" class="survivalHud"></div></div><div class="landscapeHint">📱 横画面にすると遊びやすいよ</div><div class="canvasWrap" id="canvasWrap"><canvas id="cv" width="1000" height="640"></canvas><div class="banner" id="banner"></div><div class="killfeed" id="killfeed"></div><div class="reactionToast" id="reactionToast"></div></div><div class="controls" id="controls"><div class="dpad"><button class="ctrl up" data-key="up">▲</button><button class="ctrl left" data-key="left">◀</button><button class="ctrl down" data-key="down">▼</button><button class="ctrl right" data-key="right">▶</button></div><div class="rightControls"><button class="shoot" data-key="shoot"><span>💥</span>FIRE</button><button class="itemBtn" id="itemBtn" disabled>ITEM －</button></div></div><div class="spectator" id="spectator">👀 観戦中 <span>次ラウンドで復帰</span></div><div class="itemLegend" id="itemLegend"><span>⚡ レーザー</span><span>🔱 ショットガン</span><span>🛡️ シールド</span><span>💣 地雷</span></div>${battle?`<div class="chatRow on" id="chatRow"><div class="chatLine empty" id="chatLine">チャットはここに1行だけ表示</div><input id="chatInput" maxlength="60" placeholder="ひとこと…"><button class="chatSend" id="chatSend">送信</button></div><div class="reactions">${['🔥','😂','💥','😭','👏'].map(e=>`<button class="react" data-react="${e}">${e}</button>`).join('')}</div><button class="btn" id="again" style="display:none">ロビーに戻る</button>`:`<div class="gameActions"><button class="btn secondary" id="again" style="display:none">SURVIVALロビーへ</button><button class="btn ghost" id="menuBackGame">← メインメニュー</button></div>`}</div>`;
  $$('[data-key]').forEach(bindHoldButton);$('#itemBtn').addEventListener('click',e=>{e.preventDefault();send('use_item')});$('#itemBtn').addEventListener('contextmenu',e=>e.preventDefault());$$('[data-react]').forEach(b=>b.onclick=()=>send('reaction',{emoji:b.dataset.react}));$('#again').onclick=()=>send('reset');if($('#menuBackGame'))$('#menuBackGame').onclick=goHome;if($('#chatSend')){$('#chatSend').onclick=sendChat;$('#chatInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendChat()}})}$('#game').addEventListener('contextmenu',e=>{if(e.target.closest('.controls'))e.preventDefault()});$('#game').addEventListener('selectstart',e=>{if(e.target.closest('.controls'))e.preventDefault()});syncVisualState(s);startRenderLoop()}
function sendChat(){let i=$('#chatInput');if(!i)return;let text=i.value.trim();if(!text)return;send('chat',{text});i.value=''}
function updateGame(s){syncVisualState(s);let battle=s.mode==='battle';$('#scoreboard').style.display=battle?'flex':'none';$('#survivalHud').style.display=battle?'none':'flex';
  if(battle){let ss=humanList(s).map(p=>`${p.id}:${p.score}`).join('|')+`/${s.target_score}`;if(ss!==scoreSig){scoreSig=ss;$('#scoreboard').innerHTML=scores(s)}}else{let ss=`${s.survival.wave}|${s.survival.kills}|${Math.floor((s.survival.elapsed||0)*2)}`;if(ss!==survSig){survSig=ss;$('#survivalHud').innerHTML=`<div class="survChip">WAVE <strong>${s.survival.wave||1}</strong></div><div class="survChip">撃破 <strong>${s.survival.kills}</strong></div><div class="survChip">TIME <strong>${fmt(s.survival.elapsed)}</strong></div>`}}
  let b=$('#banner'),me=s.players.find(p=>p.id===s.player_id),dead=!!(me&&!me.alive),controls=$('#controls'),spectator=$('#spectator'),itemBtn=$('#itemBtn');
  if(dead&&battle){if(controls)controls.style.display='none';spectator?.classList.add('on');resetInput()}else{if(controls&&s.stage!=='finished')controls.style.display='grid';spectator?.classList.remove('on')}
  if(itemBtn){if(!s.items_enabled){itemBtn.style.display='none'}else{itemBtn.style.display='block';let it=me?.item;if(it&&ITEM[it]){itemBtn.disabled=false;itemBtn.classList.add('ready');itemBtn.textContent=`${ITEM[it][0]} ${ITEM[it][1]} を使う`}else{itemBtn.disabled=true;itemBtn.classList.remove('ready');itemBtn.textContent='ITEM －'}}}
  if($('#itemLegend'))$('#itemLegend').style.display=s.items_enabled?'flex':'none';
  if(s.stage==='countdown')b.innerHTML=`<div class="big">${Math.max(1,Math.ceil(s.countdown))}</div><div class="sub">${battle?`ROUND ${s.round}`:`WAVE ${s.survival.wave}`}</div>`;
  else if(s.stage==='round_end')b.innerHTML=`<div class="big" style="font-size:54px">${esc(s.message)}</div><div class="sub">NEXT ROUND...</div>`;
  else if(s.stage==='wave_clear')b.innerHTML=`<div class="big" style="font-size:50px">${esc(s.message)}</div><div class="sub">NEXT WAVE...</div>`;
  else if(s.stage==='finished'&&!battle){b.innerHTML=`<div class="big" style="font-size:54px">GAME OVER</div><div class="resultGrid"><div class="resultCell">WAVE<strong>${s.survival.wave}</strong></div><div class="resultCell">撃破<strong>${s.survival.kills}</strong></div><div class="resultCell">TIME<strong>${fmt(s.survival.elapsed)}</strong></div></div>`;$('#again').style.display=s.is_host?'block':'none';if(controls)controls.style.display='none';resetInput()}
  else if(s.stage==='finished'){b.innerHTML=`<div class="big" style="font-size:54px">${esc(s.message)}</div><div class="sub">GAME SET</div>`;$('#again').style.display=s.is_host?'block':'none'}
  else if(dead&&battle)b.innerHTML=`<div class="big" style="font-size:48px">💥</div><div class="sub">撃破された！ 観戦中</div>`;else b.innerHTML='';
  let rs=battle?(s.reactions||[]).map(r=>`${r.emoji}:${r.sender}`).join('|'):'';if(rs!==reactionSig){reactionSig=rs;$('#reactionToast').innerHTML=battle?(s.reactions||[]).map(r=>`<div class="reactionItem"><b>${r.emoji}</b>${esc(r.sender)}</div>`).join(''):''}
  let ks=(s.killfeed||[]).map(k=>k.text).join('|');if(ks!==killSig){killSig=ks;$('#killfeed').innerHTML=(s.killfeed||[]).map(k=>`<div class="killItem">${esc(k.text)}</div>`).join('')}
  if(battle&&$('#chatLine')){let cs=s.chat?`${s.chat.name}:${s.chat.text}`:'';if(cs!==chatSig){chatSig=cs;if(s.chat){$('#chatLine').classList.remove('empty');$('#chatLine').innerHTML=`<strong>${esc(s.chat.name)}:</strong> ${esc(s.chat.text)}`}else{$('#chatLine').classList.add('empty');$('#chatLine').textContent='チャットはここに1行だけ表示'}}}
  let shake=(s.effects||[]).some(e=>e.kind==='explosion'&&e.ttl>.42),wrap=$('#canvasWrap');if(wrap)wrap.style.transform=shake?`translate(${(Math.random()*8-4).toFixed(1)}px,${(Math.random()*8-4).toFixed(1)}px)`:'translate(0,0)'}
function draw(s){let c=$('#cv');if(!c)return;let x=c.getContext('2d');x.clearRect(0,0,1000,640);x.fillStyle='#080b10';x.fillRect(0,0,1000,640);x.strokeStyle='#34445a';x.lineWidth=8;x.strokeRect(4,4,992,632);x.fillStyle='#28364a';for(let w of s.walls)x.fillRect(w.x,w.y,w.w,w.h);
  for(let item of s.pickups||[]){let m=ITEM[item.kind]||['?',''];x.save();x.translate(item.x,item.y);x.beginPath();x.arc(0,0,19,0,Math.PI*2);x.fillStyle='rgba(20,29,43,.94)';x.fill();x.strokeStyle='#d7edff';x.lineWidth=2;x.stroke();x.font='22px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText(m[0],0,1);x.restore()}
  for(let mine of s.mines||[]){x.save();x.translate(mine.x,mine.y);x.beginPath();x.arc(0,0,12,0,Math.PI*2);x.fillStyle=mine.armed?'#ff715e':'#6c7480';x.fill();x.strokeStyle='#16191e';x.lineWidth=3;x.stroke();if(mine.armed){x.beginPath();x.arc(0,0,18,0,Math.PI*2);x.strokeStyle='rgba(255,113,94,.45)';x.lineWidth=2;x.stroke()}x.restore()}
  for(let bullet of s.bullets){let o=s.players.find(p=>p.id===bullet.owner_id),v=visualBullets.get(bullet.id),bx=v?.x??bullet.x,by=v?.y??bullet.y;x.beginPath();x.arc(bx,by,bullet.kind==='shotgun'?5:7,0,Math.PI*2);x.fillStyle=o?.color||'#fff';x.shadowColor=x.fillStyle;x.shadowBlur=16;x.fill();x.shadowBlur=0}
  for(let p of s.players){let v=visualPlayers.get(p.id),px=v?.x??p.x,py=v?.y??p.y,pa=v?.a??p.angle;x.save();x.translate(px,py);x.rotate(pa);x.globalAlpha=p.alive?1:.18;x.fillStyle=p.color;x.fillRect(-20,-15,40,30);x.fillStyle='#0b1118';x.fillRect(-14,-8,28,16);x.fillStyle=p.color;x.fillRect(3,-5,30,10);x.beginPath();x.arc(0,0,8,0,Math.PI*2);x.fill();x.restore();if(p.shield&&p.alive){x.beginPath();x.arc(px,py,29,0,Math.PI*2);x.strokeStyle='#9eeeff';x.lineWidth=4;x.shadowColor='#64e5ff';x.shadowBlur=14;x.stroke();x.shadowBlur=0}x.font='700 13px system-ui';x.textAlign='center';x.fillStyle=p.alive?'#fff':'#738093';x.fillText(p.name,px,py-30);if(p.item&&p.alive){x.font='18px system-ui';x.fillText((ITEM[p.item]||['?'])[0],px+27,py-23)}}
  let me=s.players.find(p=>p.id===s.player_id),mv=me&&visualPlayers.get(me.id);if(me&&mv&&me.alive&&performance.now()<localMuzzleUntil){let mx=mv.x+Math.cos(mv.a)*35,my=mv.y+Math.sin(mv.a)*35;x.save();x.fillStyle='#fff2ad';x.shadowColor='#ffd15c';x.shadowBlur=18;x.beginPath();x.arc(mx,my,11,0,Math.PI*2);x.fill();x.restore()}
  for(let e of s.effects||[]){let phase=Math.max(0,Math.min(1,e.ttl/.75));if(e.kind==='laser'){x.save();x.strokeStyle=e.color||'#fff';x.lineWidth=7;x.shadowColor=x.strokeStyle;x.shadowBlur=22;x.beginPath();x.moveTo(e.x1,e.y1);x.lineTo(e.x2,e.y2);x.stroke();x.restore()}else if(e.kind==='explosion'){let r=20+(1-phase)*55;x.save();x.globalAlpha=Math.min(1,phase*1.5);let g=x.createRadialGradient(e.x,e.y,2,e.x,e.y,r);g.addColorStop(0,'#fff8cf');g.addColorStop(.25,'#ffcf52');g.addColorStop(.6,'#ff7043');g.addColorStop(1,'rgba(255,50,30,0)');x.fillStyle=g;x.beginPath();x.arc(e.x,e.y,r,0,Math.PI*2);x.fill();x.restore()}else if(e.kind==='shield_break'||e.kind==='shield_on'){x.save();x.globalAlpha=phase;x.strokeStyle='#a8f2ff';x.lineWidth=5;x.beginPath();x.arc(e.x,e.y,28+(1-phase)*28,0,Math.PI*2);x.stroke();x.restore()}else if(e.kind==='pickup'){x.save();x.globalAlpha=phase;x.font='30px system-ui';x.textAlign='center';x.fillText(e.text||'✨',e.x,e.y-30-(1-phase)*18);x.restore()}else if(e.kind==='muzzle'){x.save();x.globalAlpha=phase;x.fillStyle='#fff0a8';x.beginPath();x.arc(e.x,e.y,10+(1-phase)*10,0,Math.PI*2);x.fill();x.restore()}}}
const keyMap={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',' ':'shoot',e:'item',E:'item'};
addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target?.tagName))return;let k=keyMap[e.key];if(!k||!gameMounted)return;e.preventDefault();if(k==='item'){if(!e.repeat)send('use_item');return}if(!input[k]){setInput(k,true);if(k==='shoot'){instantFireFeedback();send('shoot')}}});addEventListener('keyup',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target?.tagName))return;let k=keyMap[e.key];if(!k||!gameMounted||k==='item')return;e.preventDefault();setInput(k,false)});addEventListener('blur',resetInput);document.addEventListener('visibilitychange',()=>{if(document.hidden)resetInput()});
if(parts[0]==='host'&&parts[1]){code=parts[1];hostInit()}else if(parts[0]==='join'&&parts[1]){code=parts[1];joinInit()}else show('home');
